<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Fury Group · Веб-редактор</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0C11;color:#E8ECF4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit}
.hidden{display:none!important}
#login{display:flex;align-items:center;justify-content:center;height:100vh}
.lbox{background:#141824;border:1px solid #232A3A;border-radius:16px;padding:32px;width:340px;text-align:center}
.lbox h1{font-size:18px;margin-bottom:4px}
.lbox p{color:#8E97A8;font-size:12px;margin-bottom:20px}
.lbox input{width:100%;padding:12px;border-radius:10px;border:1px solid #232A3A;background:#0A0C11;color:#E8ECF4;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:12px}
.btn{background:#4D8DFF;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600}
.btn.gray{background:#232A3A}
.btn.red{background:#3A2026;color:#FF5D5D}
.lerr{color:#FF5D5D;font-size:12px;margin-top:10px;min-height:16px}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid #232A3A;position:sticky;top:0;background:#0A0C11;z-index:50}
header h1{font-size:16px}
header h1 span{color:#4D8DFF}
.tabs{display:flex;gap:6px;margin-left:12px}
.tab{background:#141824;border:1px solid #232A3A;color:#8E97A8;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600}
.tab.on{background:#4D8DFF;border-color:#4D8DFF;color:#fff}
.spacer{flex:1}
.weeknav{display:flex;align-items:center;gap:10px;padding:14px 20px}
.weeknav .wlabel{font-weight:700;font-size:15px;min-width:220px;text-align:center}
.navb{background:#141824;border:1px solid #232A3A;color:#E8ECF4;border-radius:10px;padding:8px 14px;font-size:15px}
.todaybtn{background:#141824;border:1px solid #4D8DFF;color:#4D8DFF;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 20px 30px}
.dcol{background:#10141D;border:1px solid #1C2331;border-radius:12px;padding:8px;min-height:200px}
.dcol.today{border-color:#4D8DFF}
.dhead{font-size:12px;font-weight:700;color:#8E97A8;text-align:center;padding:4px 0 8px}
.dcol.today .dhead{color:#4D8DFF}
.ecard{border-radius:8px;padding:7px 8px;margin-bottom:6px;cursor:pointer;border-left:3px solid}
.ecard .t{font-size:11px;color:#8E97A8}
.ecard .n{font-size:12px;font-weight:600;margin:2px 0}
.ecard .s{font-size:11px;color:#8E97A8}
.addev{width:100%;background:none;border:1px dashed #232A3A;color:#8E97A8;border-radius:8px;padding:6px;font-size:12px}
.tlbar{display:flex;align-items:center;gap:12px;padding:14px 20px}
.tlbar .hint{color:#8E97A8;font-size:12px}
.tlwrap{overflow-x:auto;margin:0 20px 30px;border:1px solid #1C2331;border-radius:12px;background:#10141D}
.tlrow{display:flex;height:34px;border-bottom:1px solid #1C2331}
.tlrow:last-child{border-bottom:0}
.tlname{flex:0 0 130px;width:130px;position:sticky;left:0;background:#141824;z-index:10;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;border-right:1px solid #232A3A}
.tltrack{position:relative;flex:0 0 auto;cursor:pointer}
.tlbarv{position:absolute;top:4px;height:26px;border-radius:6px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;cursor:pointer;border:1px solid}
.mband{position:absolute;top:0;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0A0C11;border-radius:4px}
.dnum{position:absolute;top:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8E97A8}
.dnum.we{color:#5A6376}
.dnum.today{color:#fff;background:#4D8DFF;border-radius:6px;font-weight:700}
.ddow{position:absolute;top:47px;height:13px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#8E97A8;text-transform:lowercase}
.ddow.sun{color:#5A6376;opacity:.55}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:#141824;border:1px solid #232A3A;border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto}
.mbox h2{font-size:15px;margin-bottom:16px}
.fl{font-size:11px;color:#8E97A8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
.fi{width:100%;padding:10px;border-radius:10px;border:1px solid #232A3A;background:#0A0C11;color:#E8ECF4;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #232A3A;background:#0A0C11;color:#8E97A8;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600}
.chip.on{color:#fff;border-color:transparent}
.mrow{display:flex;gap:10px}
.mrow>*{flex:1}
.mbtns{display:flex;gap:10px;margin-top:20px}
.mbtns .btn{flex:1}
</style></head><body>
<div id="login"><div class="lbox"><h1>FURY GROUP · Веб-редактор</h1><p>Введи код доступу адміністратора</p><input id="codein" type="password" inputmode="numeric" placeholder="••••"/><button class="btn" style="width:100%" onclick="doLogin()">Увійти</button><div class="lerr" id="lerr"></div></div></div>
<div id="app" class="hidden">
<header><h1>FURY <span>GROUP</span></h1><div class="tabs"><button class="tab on" id="tabS" onclick="setTab('s')">Розклад тижня</button><button class="tab" id="tabT" onclick="setTab('t')">Таймлайн</button></div><div class="spacer"></div><button class="btn gray" onclick="logout()">Вийти</button></header>
<div id="schedTab"><div class="weeknav"><button class="navb" onclick="shiftWeek(-1)">◀</button><div class="wlabel" id="wlabel"></div><button class="navb" onclick="shiftWeek(1)">▶</button><button class="todaybtn" onclick="goToday()">Сьогодні</button></div><div class="sched" id="schedGrid"></div></div>
<div id="tlTab" class="hidden"><div class="tlbar"><button class="btn" onclick="openTl(null,null,null)">+ Додати запис</button><div class="hint">Клікни по порожній клітинці, щоб додати з конкретної дати, або по смузі — щоб редагувати</div></div><div class="tlwrap" id="tlWrap"></div></div>
</div>
<div id="modalHost"></div>
<script>
var API='https://dcuuzhwquvbohjmzxfmu.supabase.co/functions/v1/admin-web/api';
var code=sessionStorage.getItem('fg_code')||'';
var D={members:[],events:[],timeline:[]};
var WD=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
var MONS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
var MS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
var CATS={fp:['ФП','#34C77B'],fire:['Вогнева','#FF5D5D'],med:['Такмед','#2EC8C8'],sip:['СІП','#A06BFF'],tech:['Технічна','#FF9F43'],fly:['Польоти','#4D8DFF'],gt:['Загальна','#8E97A8'],pgd:['ПГД','#FFD24D'],ops:['Інше','#FF6BB3']};
var KINDS={leave:['Відпустка','#8E97A8'],trip:['Відрядження','#4D8DFF'],combat:['ОБЗ','#FF5D5D'],course:['Курси','#FFB03A']};
var MBAND=['#E8912D','#6FCF4E','#4D8DFF','#A06BFF','#FF6BB3','#2EC8C8','#FFD24D'];
var CW=30;
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);var f=new Date(Date.UTC(t.getUTCFullYear(),0,4));var fd=(f.getUTCDay()+6)%7;f.setUTCDate(f.getUTCDate()-fd+3);return 1+Math.round((t-f)/(7*864e5));}
function mondayOf(w){var y=(new Date()).getFullYear();var j=new Date(y,0,4);var jd=(j.getDay()+6)%7;var m1=new Date(y,0,4-jd);return new Date(m1.getFullYear(),m1.getMonth(),m1.getDate()+(w-1)*7);}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function dow(d){return (d.getDay()+6)%7;}
function ymd(d){function p(n){return (n<10?'0':'')+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function sameD(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate();}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
var TODAY=new Date();var CURW=isoWeek(TODAY);var state={tab:'s',week:CURW};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function api(op,payload){var b=Object.assign({op:op,code:code},payload||{});var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});var j=await r.json();if(!r.ok){throw new Error(j.error||('HTTP '+r.status));}return j;}
async function doLogin(){var v=document.getElementById('codein').value.trim();document.getElementById('lerr').textContent='';try{code=v;await api('login');sessionStorage.setItem('fg_code',v);start();}catch(e){code='';document.getElementById('lerr').textContent='Невірний код';}}
function logout(){sessionStorage.removeItem('fg_code');location.reload();}
async function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');var pb=document.getElementById('pdfBtn');if(pb){pb.style.display='block';}await loadAll();}
async function loadAll(){try{var r=await api('load');D=r;render();}catch(e){alert('Помилка завантаження: '+e.message);}}
function setTab(t){state.tab=t;document.getElementById('tabS').className='tab'+(t=='s'?' on':'');document.getElementById('tabT').className='tab'+(t=='t'?' on':'');document.getElementById('schedTab').className=(t=='s'?'':'hidden');document.getElementById('tlTab').className=(t=='t'?'':'hidden');render();}
function render(){if(state.tab=='s'){renderSched();}else{renderTl();}}
function shiftWeek(n){state.week+=n;renderSched();}
function goToday(){state.week=CURW;renderSched();}
function memName(id){for(var i=0;i<D.members.length;i++){if(D.members[i].id==id)return D.members[i].cs;}return id;}
// ---------- SCHEDULE ----------
function evVisible(e,w){if(e.week==null){return w==CURW;}return e.week==w;}
function renderSched(){var mon=mondayOf(state.week);var sun=addD(mon,6);var lbl='Тиж '+state.week+' · '+mon.getDate()+' '+MS[mon.getMonth()]+' – '+sun.getDate()+' '+MS[sun.getMonth()];document.getElementById('wlabel').textContent=lbl;var g=document.getElementById('schedGrid');g.innerHTML='';for(var d=0;d<7;d++){var date=addD(mon,d);var col=document.createElement('div');col.className='dcol'+(sameD(date,TODAY)?' today':'');var h='<div class="dhead">'+WD[d]+' '+date.getDate()+' '+MS[date.getMonth()]+'</div>';var evs=D.events.filter(function(e){return e.day==d&&evVisible(e,state.week);}).sort(function(a,b){return a.start_hm<b.start_hm?-1:1;});for(var i=0;i<evs.length;i++){var e=evs[i];var c=CATS[e.cat]||CATS.gt;var att=(e.attendee_ids&&e.attendee_ids.length)?e.attendee_ids.length+' осіб':'всі';h+='<div class="ecard" style="background:'+c[1]+'22;border-left-color:'+c[1]+'" onclick="openEv(&quot;'+e.id+'&quot;,'+d+')"><div class="t">'+esc(e.start_hm)+' – '+esc(e.end_hm)+' · '+c[0]+'</div><div class="n">'+esc(e.title)+'</div><div class="s">'+esc(e.sub)+(e.sub?' · ':'')+att+'</div></div>';}
h+='<button class="addev" onclick="openEv(null,'+d+')">+ Додати</button>';col.innerHTML=h;g.appendChild(col);}}
function openEv(id,day){var ev=null;if(id){for(var i=0;i<D.events.length;i++){if(D.events[i].id==id){ev=D.events[i];break;}}}
var mon=mondayOf(state.week);var date=addD(mon,day);
var selCat=ev?ev.cat:'gt';var selAtt=ev&&ev.attendee_ids?ev.attendee_ids.slice():null;var parsed=parseSub(ev?ev.sub:'');var busy=busyIds(day);
var ns=nextSlot(day);
var h='<div class="modal" id="mod"><div class="mbox"><h2>'+(ev?'Редагувати заняття':'Нове заняття')+' · '+WD[day]+' '+date.getDate()+' '+MS[date.getMonth()]+'</h2>';
if(!ev){h+='<div class="fl">Шаблони</div><div class="chips">';for(var tq=0;tq<TPLS.length;tq++){h+='<button class="chip" onclick="applyTpl('+tq+')">'+esc(TPLS[tq].t)+'</button>';}h+='</div>';}
h+='<div class="mrow"><div><div class="fl">Початок</div><input class="fi" type="time" id="fSt" value="'+(ev?ev.start_hm:ns[0])+'"'+(ev?'':' onchange="syncEnd()"')+'/></div><div><div class="fl">Кінець</div><input class="fi" type="time" id="fEn" value="'+(ev?ev.end_hm:ns[1])+'"/></div></div>';
h+='<div class="fl">Назва</div><input class="fi" id="fTi" value="'+esc(ev?ev.title:'')+'" placeholder="Напр. Вогнева підготовка"/>';
h+='<div class="fl">Місце</div><div class="chips" id="plChips">';
for(var p=0;p<PLACES.length;p++){var pon=parsed.place==PLACES[p];h+='<button class="chip'+(pon?' on':'')+'" data-v="'+PLACES[p]+'" style="'+(pon?'background:#34C77B':'')+'" onclick="pickPl(this)">'+PLACES[p]+'</button>';}
h+='</div><input class="fi" id="fPl" style="margin-top:8px" value="'+esc(parsed.place)+'" placeholder="Або впиши власне місце" oninput="plSync()"/>';
h+='<div class="fl">Хто веде</div><input class="fi" id="fLead" list="leadDl" value="'+esc(parsed.leadName||'')+'" placeholder="Обери зі списку або впиши вручну"/><datalist id="leadDl">';
for(var L2=0;L2<D.members.length;L2++){h+='<option value="'+esc(D.members[L2].cs)+'"></option>';}
h+='</datalist>';
h+='<div class="fl">Примітки</div><input class="fi" id="fNo" value="'+esc(parsed.notes)+'" placeholder="Додаткова інформація"/>';
h+='<div class="fl">Категорія</div><div class="chips" id="catChips">';
for(var k in CATS){h+='<button class="chip'+(k==selCat?' on':'')+'" data-k="'+k+'" style="'+(k==selCat?'background:'+CATS[k][1]:'')+'" onclick="pickCat(this)">'+CATS[k][0]+'</button>';}
h+='</div><div class="fl">Учасники</div><button class="btn gray" style="width:100%;margin-bottom:8px;border:1px solid #4D8DFF;color:#4D8DFF;background:#141824" onclick="pickAllFree()">✓ Всі вільні</button><div class="chips" id="attChips">';
for(var i=0;i<D.members.length;i++){var m=D.members[i];var on=selAtt&&selAtt.indexOf(m.id)>=0;var bz=busy[m.id];var st=on?'background:#4D8DFF':(bz?'border-color:#FF9F43;color:#FF9F43;opacity:.7':'');h+='<button class="chip'+(on?' on':'')+'" data-k="'+m.id+'"'+(bz?' data-busy="1"':'')+' style="'+st+'" onclick="pickAtt(this)">'+esc(m.cs)+(bz?' · '+esc(bz):'')+'</button>';}
h+='</div><div class="mbtns">'+(ev?'<button class="btn red" onclick="delEv(&quot;'+ev.id+'&quot;)">Видалити</button>':'')+'<button class="btn gray" onclick="closeMod()">Скасувати</button><button class="btn" onclick="saveEv('+(ev?'&quot;'+ev.id+'&quot;':'null')+','+day+')">Зберегти</button></div></div></div>';
document.getElementById('modalHost').innerHTML=h;}
var TPLS=[{t:'Фізична підготовка',l:'Тиждень',p:'ППД',c:'fp'},{t:'Практичні польоти',l:'Тиждень',p:'Гостомель',c:'fly'},{t:'Стрілецьке тренування',l:'Сапсан',p:'ППД',c:'fire'},{t:'Вогнева підготовка',l:'Сапсан',p:'Дача',c:'fire'},{t:'ВМП',l:'Маверік',p:'17 кабінет',c:'med'},{t:'ПГД',l:'',p:'ППД',c:'pgd'}];
function applyTpl(i){var tp=TPLS[i];document.getElementById('fTi').value=tp.t;document.getElementById('fLead').value=tp.l;document.getElementById('fPl').value=tp.p;plSync();var ch=document.getElementById('catChips').children;for(var q=0;q<ch.length;q++){if(ch[q].dataset.k==tp.c){pickCat(ch[q]);break;}}}
function hm2m(s){var p=String(s||'').split(':');return (+p[0])*60+(+p[1]||0);}
function m2hm(x){var h=Math.floor(x/60),mm=x%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
function nextSlot(day){var evs=D.events.filter(function(e){return e.day==day&&evVisible(e,state.week);});if(!evs.length)return['09:00','11:00'];var mx=0;for(var i=0;i<evs.length;i++){var em=hm2m(evs[i].end_hm);if(em>mx)mx=em;}if(mx>=21*60)return['09:00','11:00'];return[m2hm(mx),m2hm(Math.min(mx+120,23*60+59))];}
function syncEnd(){var s=hm2m(document.getElementById('fSt').value);document.getElementById('fEn').value=m2hm(Math.min(s+120,23*60+59));}
function pickCat(btn){var ch=document.getElementById('catChips').children;for(var i=0;i<ch.length;i++){ch[i].className='chip';ch[i].style.background='';}btn.className='chip on';btn.style.background=CATS[btn.dataset.k][1];}
function setAttChip(c,on){c.className='chip'+(on?' on':'');c.style.background=on?'#4D8DFF':'';if(!on&&c.dataset.busy){c.style.borderColor='#FF9F43';c.style.color='#FF9F43';c.style.opacity='.7';}else{c.style.borderColor='';c.style.color='';c.style.opacity='';}}
function pickAtt(btn){setAttChip(btn,btn.className.indexOf('on')<0);}
function pickAllFree(){var box=document.getElementById('attChips');for(var i=0;i<box.children.length;i++){setAttChip(box.children[i],!box.children[i].dataset.busy);}}
function closeMod(){document.getElementById('modalHost').innerHTML='';}
var PLACES=['ППД','Дача','Гостомель','Гоголів','17 кабінет'];/*v13*/
function parseSub(sub){var place='',leadName='',notes=[];var parts=String(sub||'').split(' · ');for(var i=0;i<parts.length;i++){var s=parts[i].trim();if(!s)continue;if(!leadName&&s.length>5&&s.slice(-5)==' веде'){leadName=s.slice(0,-5).trim();continue;}if(!place){place=s;}else{notes.push(s);}}return {place:place,leadName:leadName,notes:notes.join(' · ')};}
function busyIds(day){var out={};for(var i=0;i<D.timeline.length;i++){var t=D.timeline[i];if(t.week==state.week&&t.start_day<=day&&t.end_day>=day){out[t.member_id]=(KINDS[t.kind]||KINDS.leave)[0];}}return out;}
function pickPl(btn){document.getElementById('fPl').value=btn.dataset.v;plSync();}
function plSync(){var v=document.getElementById('fPl').value.trim();var ch=document.getElementById('plChips').children;for(var i=0;i<ch.length;i++){var on=ch[i].dataset.v==v;ch[i].className='chip'+(on?' on':'');ch[i].style.background=on?'#34C77B':'';}}
async function saveEv(id,day){var st=document.getElementById('fSt').value||'09:00';var en=document.getElementById('fEn').value||st;var ti=document.getElementById('fTi').value.trim();if(!ti){alert('Вкажи назву');return;}var pl=document.getElementById('fPl').value.trim();var ld=document.getElementById('fLead').value.trim();var no=document.getElementById('fNo').value.trim();var sp=[];if(pl)sp.push(pl);if(ld)sp.push(ld+' веде');if(no)sp.push(no);var su=sp.join(' · ');var cat='gt';var ch=document.getElementById('catChips').children;for(var i=0;i<ch.length;i++){if(ch[i].className.indexOf('on')>=0)cat=ch[i].dataset.k;}
var att=[];var ab=document.getElementById('attChips').children;for(var j=0;j<ab.length;j++){if(ab[j].className.indexOf('on')>=0)att.push(ab[j].dataset.k);}if(att.length==0)att=null;
var old=null;if(id){for(var x=0;x<D.events.length;x++){if(D.events[x].id==id)old=D.events[x];}}
var row={id:id||crypto.randomUUID(),day:day,week:state.week,start_hm:st,end_hm:en,title:ti,sub:su,cat:cat,attendee_ids:att,live:old?old.live:false};
try{await api('upsert',{table:'events',rows:[row]});D.events=D.events.filter(function(e){return e.id!=row.id;});D.events.push(row);closeMod();renderSched();}catch(e){alert('Помилка: '+e.message);}}
async function delEv(id){if(!confirm('Видалити заняття?'))return;try{await api('delete',{table:'events',ids:[id]});D.events=D.events.filter(function(e){return e.id!=id;});closeMod();renderSched();}catch(e){alert('Помилка: '+e.message);}}
// ---------- TIMELINE ----------
var tlStart=null,tlDays=84;
function dateOfWD(w,d){return addD(mondayOf(w),d);}
function idxOf(d){return Math.round((d-tlStart)/864e5);}
function mergedBars(mid){var items=D.timeline.filter(function(t){return t.member_id==mid;}).map(function(t){return {ids:[t.id],s:dateOfWD(t.week,t.start_day),e:dateOfWD(t.week,t.end_day),label:t.label,kind:t.kind};}).sort(function(a,b){return a.s-b.s;});var out=[];for(var i=0;i<items.length;i++){var it=items[i];var last=out[out.length-1];if(last&&last.label==it.label&&last.kind==it.kind&&(it.s-last.e)<=864e5*1.5){if(it.e>last.e)last.e=it.e;last.ids=last.ids.concat(it.ids);}else{out.push(it);}}return out;}
function renderTl(){tlStart=mondayOf(CURW-2);var wrap=document.getElementById('tlWrap');wrap.innerHTML='';var W=tlDays*CW;
var head=document.createElement('div');head.className='tlrow';head.style.height='62px';head.innerHTML='<div class="tlname" style="height:62px">Позивний / Дата</div>';

for(var j=0;j<tlDays;j++){var d2=addD(tlStart,j);var cls='dnum'+(dow(d2)==6?' we':'')+(sameD(d2,TODAY)?' today':'');hh+='<div class="'+cls+'" style="left:'+(j*CW)+'px;width:'+CW+'px">'+d2.getDate()+'</div>';var wcls='ddow'+(dow(d2)==6?' sun':'');hh+='<div class="'+wcls+'" style="left:'+(j*CW)+'px;width:'+CW+'px">'+WD[dow(d2)]+'</div>';}
ht.innerHTML=hh;head.appendChild(ht);wrap.appendChild(head);
var grid='repeating-linear-gradient(to right,transparent,transparent '+(CW-1)+'px,#1C2331 '+(CW-1)+'px,#1C2331 '+CW+'px)';
var tIdx=idxOf(new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()));

async function delTl(){if(!tlEditIds)return;if(!confirm('Видалити запис?'))return;try{await api('delete',{table:'timeline_items',ids:tlEditIds});D.timeline=D.timeline.filter(function(t){return tlEditIds.indexOf(t.id)<0;});closeMod();renderTl();}catch(e){alert('Помилка: '+e.message);}}

t("change",{bubbles:true}));}for(var j=0;j<3;j++){var lab=document.createElement("div");lab.textContent=names[j];lab.className=L.className;if(j>0)lab.style.marginTop="10px";var f=document.createElement("input");f.type="text";f.className=inp.className;f.value=vals[j];f.style.width="100%";if(j===1){f.setAttribute("list","furyleaddl");f.setAttribute("placeholder","Обери зі списку або впиши");ensureDl();}f.addEventListener("input",compose);f.addEventListener("change",compose);wrap.appendChild(lab);wrap.appendChild(f);fields.push(f);}inp.parentElement.insertBefore(wrap,inp);}function enhance(){var els=document.querySelectorAll("label,div,span");for(var i=0;i<els.length;i++){var L=els[i];if(L.children.length>0)continue;var t=(L.textContent||"").trim().toLowerCase();if(t!=="деталі")continue;var inp=findInp(L);if(!inp||inp.dataset.furySplit)continue;inp.dataset.furySplit="1";build(L,inp);}}new MutationObserver(enhance).observe(document.documentElement,{childList:true,subtree:true});if(document.readyState!=="loading"){enhance();}else{document.addEventListener("DOMContentLoaded",enhance);}})();</script><script>/*dbl-tap guard*/(function(){var L=0;document.addEventListener("click",function(e){var b=e.target&&e.target.closest?e.target.closest("button"):null;if(!b)return;var t=(b.textContent||"").trim();if(t.indexOf("Зберегти")===-1&&t.indexOf("Видалити")===-1)return;var n=Date.now();if(n<L){e.stopImmediatePropagation();e.preventDefault();return;}L=n+3000;b.style.opacity="0.5";b.style.pointerEvents="none";setTimeout(function(){b.style.opacity="";b.style.pointerEvents="";L=0;},3000);},true);})();</script></body></html>
